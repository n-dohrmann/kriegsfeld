[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
proto = { path = "../proto/" }
kf_core = { path = "../kf_core/" }
bevy = "0.20.1"

[features]
# TODO - this will be a default feature before
# client/server comms is worked out
default = ["debug_standalone"]

# allow server to run by itself (e.g. and allow
# rendering without sending map info to a client)
debug_standalone = []


